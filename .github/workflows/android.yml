name: Android-приложение

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/skidki.p12"

      - name: Собрать APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/skidki.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: gradle assembleRelease --no-daemon

      # skidki.apk в последнем релизе — на него ведёт кнопка на странице install.html
      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk skidki.apk
          gh release create "v1.0.${{ github.run_number }}" skidki.apk \
            --title "Скидки 1.0.${{ github.run_number }}" \
            --notes "Приложение «Скидки» для Android. Установка: страница install.html на сайте приложения." \
            --latest
