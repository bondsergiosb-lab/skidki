name: Ежедневный сбор скидок

on:
  schedule:
    # GitHub запускает по расписанию с опозданием (бывает на несколько часов), поэтому два запуска:
    # второй ничего не делает, если скидки за сегодня уже собраны. 01:17 UTC = 03:17 по Киеву зимой.
    - cron: "17 1 * * *"
    - cron: "17 3 * * *"
  workflow_dispatch:          # кнопка «Run workflow» — запустить вручную
    inputs:
      only_deploy:
        description: "Только переопубликовать сайт, без сбора"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["app/**"]         # изменили приложение — просто переопубликовать, без сбора

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

env:
  SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Что делаем
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          ONLY_DEPLOY: ${{ inputs.only_deploy }}
        run: |
          collect=true
          if [ "$EVENT" = "push" ] || [ "$ONLY_DEPLOY" = "true" ]; then collect=false; fi
          if [ "$EVENT" = "schedule" ] && curl -fsS "${SITE}data/meta.json" | python3 -c \
              "import sys,json,datetime as d; sys.exit(json.load(sys.stdin)['generated'][:10] != d.datetime.now(d.timezone.utc).strftime('%Y-%m-%d'))"; then
            echo "Скидки за сегодня уже собраны"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "collect=$collect" >> "$GITHUB_OUTPUT"

      # История цен и последние скидки лежат в ветке data (одна перезаписываемая версия — репозиторий не растёт)
      - name: Достать историю цен
        if: steps.plan.outputs.skip != 'true'
        run: |
          mkdir -p data app/data
          if git fetch --depth 1 origin data:data; then
            git show data:history.json.gz > data/history.json.gz
            for f in deals.json meta.json w.json m.json k.json; do
              git show "data:$f" > "app/data/$f" 2>/dev/null || rm -f "app/data/$f"
            done
          fi

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        if: steps.plan.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Собрать скидки
        if: steps.plan.outputs.collect == 'true' && steps.plan.outputs.skip != 'true'
        run: python -m scraper.main

      - name: Сохранить историю в ветку data
        if: steps.plan.outputs.collect == 'true' && steps.plan.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          d=$(mktemp -d)
          cp data/history.json.gz app/data/*.json "$d"/
          cd "$d"
          git init -q -b data
          git add .
          git -c user.name="skidki-bot" -c user.email="skidki-bot@users.noreply.github.com" commit -qm "Данные за $(date -u +%F)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      # адрес сервера уведомлений и открытый ключ — для страницы (пусто, пока Cloudflare не подключён)
      - name: Настройки уведомлений в браузере
        if: steps.plan.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python -m scraper.push config app/push.json

      - uses: actions/configure-pages@v5
        if: steps.plan.outputs.skip != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.plan.outputs.skip != 'true'
        with:
          path: app

  deploy:
    needs: collect
    if: needs.collect.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
